services:
  postgres:
    image: pgduckdb/pgduckdb:16-main
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-openestimate}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oe} -d ${POSTGRES_DB:-openestimate}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.unified
      # The API-only target: port 8000, no frontend, paired with the nginx
      # service below. The same file's default target is the all-in-one image.
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Parts, not a finished URL. Compose has no urlencode, so interpolating
      # the password into a URL here breaks for any password containing "@":
      # the user info splits at the first one and the host is read as whatever
      # follows it. The entrypoint composes and percent-encodes these, and a
      # DATABASE_URL set directly still overrides them.
      OE_DB_HOST: postgres
      OE_DB_PORT: "5432"
      OE_DB_USER: ${POSTGRES_USER:-oe}
      OE_DB_NAME: ${POSTGRES_DB:-openestimate}
      OE_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REDIS_URL: ${REDIS_URL:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      # Persistent data dir - pins the unified resolver (resolve_data_dir) at
      # the /data volume below. Without it the resolver defaults to
      # ~/.openestimate inside the container (ephemeral): BIM geometry is
      # written there, the DB row stays "ready", and a container recreate
      # makes the geometry endpoint 404.
      OE_DATA_DIR: ${OE_DATA_DIR:-/data}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-openestimate}
      QDRANT_URL: ${QDRANT_URL:-}
    volumes:
      - app_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      # First boot creates the schema and seeds demo/reference data. On modest
      # hosts that can take more than two minutes, so do not fail the dependent
      # frontend while the backend is still making normal startup progress.
      retries: 8
      start_period: 180s

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Bind to 127.0.0.1 for domain deployments so only the host reverse
      # proxy (Nginx/CasaOS gateway) can reach the unencrypted upstream.
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles:
      - tunnel
    depends_on:
      frontend:
        condition: service_healthy
    command: tunnel --no-autoupdate run
    environment:
      # Keep the remotely managed tunnel token in the git-ignored .env file.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    profiles:
      - ai
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pg_data:
  qdrant_data:
  app_data:
